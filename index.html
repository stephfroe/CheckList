<!DOCTYPE html>
<html lang="de" data-theme="system">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Checklisten</title>
  <style>
    :root {
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #cbd5e1;
      --primary: #2563eb;
      --danger: #ef4444;
      --success: #10b981;
      --badge-bg: #f1f5f9;
      --input-bg: #ffffff;
      --shadow: 0 1px 3px rgba(0,0,0,0.05);
    }

    @media (prefers-color-scheme: dark) {
      [data-theme="system"] {
        --bg: #0f172a;
        --card: #1e293b;
        --text: #f8fafc;
        --text-muted: #94a3b8;
        --border: #334155;
        --primary: #3b82f6;
        --danger: #f87171;
        --success: #34d399;
        --badge-bg: #0f172a;
        --input-bg: #0f172a;
        --shadow: 0 2px 6px rgba(0,0,0,0.3);
      }
    }

    [data-theme="dark"] {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      --primary: #3b82f6;
      --danger: #f87171;
      --success: #34d399;
      --badge-bg: #0f172a;
      --input-bg: #0f172a;
      --shadow: 0 2px 6px rgba(0,0,0,0.3);
    }

    [data-theme="light"] {
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #cbd5e1;
      --primary: #2563eb;
      --danger: #ef4444;
      --success: #10b981;
      --badge-bg: #f1f5f9;
      --input-bg: #ffffff;
      --shadow: 0 1px 3px rgba(0,0,0,0.05);
    }

    * { box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      max-width: 900px;
      margin: 0 auto;
      padding: 8px;
      line-height: 1.2;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    h1 { font-size: 1.1rem; margin: 0; }

    .theme-toggle {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 3px 6px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 0.75rem;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px;
      margin-bottom: 10px;
      box-shadow: var(--shadow);
    }

    label {
      display: block;
      font-size: 0.7rem;
      font-weight: 600;
      margin-top: 4px;
      margin-bottom: 2px;
      color: var(--text-muted);
    }

    input[type="text"], input[type="password"], textarea, select {
      width: 100%;
      padding: 4px 6px;
      background-color: var(--input-bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 4px;
      font-size: 0.85rem;
    }

    textarea { min-height: 40px; resize: vertical; }

    .btn {
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 4px 8px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.75rem;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      touch-action: manipulation;
    }

    .btn:active { opacity: 0.8; }
    .btn-danger { background-color: var(--danger); }
    .btn-secondary { background-color: var(--badge-bg); color: var(--text); border: 1px solid var(--border); }
    .btn-sm { padding: 2px 5px; font-size: 0.7rem; border-radius: 3px; }

    .hidden { display: none !important; }

    /* REPORTING & FILTER BAR */
    .filter-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 6px;
      margin-bottom: 8px;
    }

    .filter-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 6px;
      align-items: flex-end;
    }

    @media (max-width: 600px) {
      .filter-grid { grid-template-columns: 1fr; }
    }

    /* ULTRA KOMPAKTE EINZEILER ITEM STYLES */
    .items-list {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .item-row {
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 4px 8px;
      background: var(--card);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      min-height: 32px;
    }

    .item-row.is-available {
      border-left: 3px solid var(--success);
    }

    .item-row.is-missing {
      border-left: 3px solid var(--danger);
    }

    .item-content {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      flex-grow: 1;
      overflow: hidden;
    }

    .checkbox-label {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      user-select: none;
      font-size: 0.85rem;
      font-weight: 500;
    }

    .checkbox-label input[type="checkbox"] {
      width: 16px;
      height: 16px;
      margin: 0;
      accent-color: var(--primary);
      cursor: pointer;
    }

    .item-title-text.completed {
      text-decoration: line-through;
      color: var(--text-muted);
      opacity: 0.8;
    }

    .meta-badges {
      display: inline-flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 4px;
    }

    .badge {
      background: var(--badge-bg);
      color: var(--text);
      padding: 0px 4px;
      border-radius: 3px;
      font-size: 0.7rem;
      font-weight: 500;
      border: 1px solid var(--border);
      white-space: nowrap;
    }

    .item-notes-inline {
      font-size: 0.75rem;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 200px;
    }

    .edit-form {
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 8px;
      background: var(--card);
      margin-bottom: 4px;
    }

    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .status-bar { font-size: 0.7rem; color: var(--text-muted); }
    .flex-row { display: flex; gap: 6px; align-items: center; }

    /* DRUCK / PDF STYLES */
    @media print {
      body { background: white; color: black; max-width: 100%; padding: 0; }
      header, #config-card, .filter-card, .btn, .theme-toggle, .status-bar, hr, .flex-row input, .checkbox-label input { display: none !important; }
      .card { border: 1px solid #ccc; box-shadow: none; margin-bottom: 10px; page-break-inside: avoid; }
      .item-row { border: 1px solid #eee; page-break-inside: avoid; }
    }
  </style>
</head>
<body>

  <header>
    <h1>📋 Checklisten</h1>
    <button class="theme-toggle" onclick="toggleTheme()">
      <span id="theme-icon">🌓</span> <span id="theme-label">Design</span>
    </button>
  </header>

  <!-- CONFIG SECTION -->
  <div id="config-card" class="card">
    <h2 style="margin-top:0; font-size: 0.95rem;">GitHub Konfiguration</h2>
    <label>GitHub Personal Access Token (PAT)</label>
    <input type="password" id="cfg-token" placeholder="ghp_xxxxxxxxxxxx">

    <div class="grid-2">
      <div>
        <label>GitHub Owner</label>
        <input type="text" id="cfg-owner" placeholder="z. B. stephfroe">
      </div>
      <div>
        <label>Repository Name</label>
        <input type="text" id="cfg-repo" placeholder="z. B. CheckList">
      </div>
    </div>

    <button class="btn" style="width: 100%; margin-top: 8px;" onclick="saveConfig()">Verbinden & Laden</button>
  </div>

  <!-- APP SECTION -->
  <div id="app-card" class="card hidden">
    <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 4px;">
      <span id="sync-status" class="status-bar">Bereit</span>
      <div class="flex-row">
        <button class="btn btn-secondary btn-sm" onclick="loadDataFromGitHub()">🔄 Aktualisieren</button>
        <button class="btn btn-secondary btn-sm" onclick="resetConfig()">⚙️ Access</button>
      </div>
    </div>
    
    <hr style="border: 0; border-top: 1px solid var(--border); margin: 6px 0;">

    <!-- REPORTING & FILTER BEREICH -->
    <div class="filter-card">
      <div style="font-weight: 600; font-size: 0.75rem; margin-bottom: 2px;">🔍 Report / Filter</div>
      <div class="filter-grid">
        <div>
          <label style="margin-top:0;">Status</label>
          <select id="filter-status" onchange="render()">
            <option value="all">Alle Einträge</option>
            <option value="missing">Nur FEHLENDE</option>
            <option value="available">Nur VORHANDENE</option>
          </select>
        </div>
        <div>
          <label style="margin-top:0;">Verantwortliche Person</label>
          <select id="filter-person" onchange="render()">
            <option value="all">Alle Personen</option>
          </select>
        </div>
        <div>
          <button class="btn btn-secondary" style="width: 100%; font-size: 0.75rem;" onclick="window.print()">🖨️ Drucken / PDF</button>
        </div>
      </div>
    </div>

    <!-- Neue Liste anlegen -->
    <div class="flex-row" style="margin-bottom: 8px;">
      <input type="text" id="new-list-name" placeholder="Neue Liste (z. B. SummerBreeze)..." onkeydown="if(event.key==='Enter') addChecklist()">
      <button class="btn btn-sm" onclick="addChecklist()">+ Liste</button>
    </div>

    <!-- Container für Listen -->
    <div id="checklists-container"></div>
  </div>

  <script>
    let config = { token: '', owner: '', repo: '', path: 'data.json' };
    let appData = { lists: [] };
    let fileSha = null;

    function initTheme() {
      const savedTheme = localStorage.getItem('theme') || 'system';
      document.documentElement.setAttribute('data-theme', savedTheme);
      updateThemeLabel(savedTheme);
    }

    function toggleTheme() {
      const current = document.documentElement.getAttribute('data-theme');
      let next = 'light';
      if (current === 'light') next = 'dark';
      else if (current === 'dark') next = 'system';
      
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      updateThemeLabel(next);
    }

    function updateThemeLabel(theme) {
      const label = document.getElementById('theme-label');
      const icon = document.getElementById('theme-icon');
      if (theme === 'light') { icon.innerText = '☀️'; label.innerText = 'Hell'; }
      else if (theme === 'dark') { icon.innerText = '🌙'; label.innerText = 'Dunkel'; }
      else { icon.innerText = '🌓'; label.innerText = 'Auto'; }
    }

    window.onload = () => {
      initTheme();
      const savedConfig = localStorage.getItem('gh_checklist_config');
      if (savedConfig) {
        config = JSON.parse(savedConfig);
        document.getElementById('cfg-token').value = config.token;
        document.getElementById('cfg-owner').value = config.owner;
        document.getElementById('cfg-repo').value = config.repo;
        showApp();
        loadDataFromGitHub();
      }
    };

    function saveConfig() {
      config.token = document.getElementById('cfg-token').value.trim();
      config.owner = document.getElementById('cfg-owner').value.trim();
      config.repo = document.getElementById('cfg-repo').value.trim();

      if (!config.token || !config.owner || !config.repo) {
        alert('Bitte alle Felder ausfüllen!');
        return;
      }

      localStorage.setItem('gh_checklist_config', JSON.stringify(config));
      showApp();
      loadDataFromGitHub();
    }

    function resetConfig() {
      document.getElementById('config-card').classList.remove('hidden');
      document.getElementById('app-card').classList.add('hidden');
    }

    function showApp() {
      document.getElementById('config-card').classList.add('hidden');
      document.getElementById('app-card').classList.remove('hidden');
    }

    function setStatus(text) {
      document.getElementById('sync-status').innerText = text;
    }

    async function loadDataFromGitHub() {
      setStatus('Lade Daten...');
      const url = `https://api.github.com/repos/${config.owner}/${config.repo}/contents/${config.path}?t=${Date.now()}`;

      try {
        const response = await fetch(url, {
          headers: {
            'Authorization': `Bearer ${config.token}`,
            'Accept': 'application/vnd.github.v3+json'
          }
        });

        if (response.status === 404) {
          appData = { lists: [] };
          fileSha = null;
          setStatus('Keine data.json vorhanden.');
          render();
          return;
        }

        if (!response.ok) throw new Error(`Fehler: ${response.statusText}`);

        const data = await response.json();
        fileSha = data.sha;
        
        const content = decodeURIComponent(atob(data.content).split('').map(c => {
          return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
        }).join(''));

        appData = JSON.parse(content);
        setStatus('Aktualisiert.');
        updatePersonFilterDropdown();
        render();
      } catch (err) {
        console.error(err);
        setStatus(`Fehler: ${err.message}`);
      }
    }

    async function saveDataToGitHub() {
      setStatus('Speichere...');
      const url = `https://api.github.com/repos/${config.owner}/${config.repo}/contents/${config.path}`;

      const jsonString = JSON.stringify(appData, null, 2);
      const contentEncoded = btoa(encodeURIComponent(jsonString).replace(/%([0-9A-F]{2})/g, (match, p1) => {
        return String.fromCharCode('0x' + p1);
      }));

      const body = {
        message: 'Update checklists',
        content: contentEncoded
      };

      if (fileSha) body.sha = fileSha;

      try {
        const response = await fetch(url, {
          method: 'PUT',
          headers: {
            'Authorization': `Bearer ${config.token}`,
            'Content-Type': 'application/json',
            'Accept': 'application/vnd.github.v3+json'
          },
          body: JSON.stringify(body)
        });

        if (!response.ok) throw new Error(`Fehler: ${response.statusText}`);

        const resData = await response.json();
        fileSha = resData.content.sha;
        setStatus('Gespeichert!');
        updatePersonFilterDropdown();
      } catch (err) {
        console.error(err);
        setStatus(`Fehler beim Speichern: ${err.message}`);
      }
    }

    function updatePersonFilterDropdown() {
      const personSelect = document.getElementById('filter-person');
      const currentSelected = personSelect.value;
      
      const persons = new Set();
      appData.lists.forEach(l => {
        l.items.forEach(i => {
          if (i.verantwortlich && i.verantwortlich.trim()) {
            persons.add(i.verantwortlich.trim());
          }
        });
      });

      personSelect.innerHTML = '<option value="all">Alle Personen</option>';
      persons.forEach(p => {
        const opt = document.createElement('option');
        opt.value = p;
        opt.innerText = p;
        if (p === currentSelected) opt.selected = true;
        personSelect.appendChild(opt);
      });
    }

    function addChecklist() {
      const input = document.getElementById('new-list-name');
      const title = input.value.trim();
      if (!title) return;

      appData.lists.push({
        id: Date.now(),
        title: title,
        schema: [],
        items: []
      });

      input.value = '';
      render();
      saveDataToGitHub();
    }

    function deleteList(listId) {
      if (!confirm('Gesamte Liste löschen?')) return;
      appData.lists = appData.lists.filter(l => l.id !== listId);
      render();
      saveDataToGitHub();
    }

    function addItemDirect(listId) {
      const input = document.getElementById(`input-add-item-${listId}`);
      const title = input.value.trim();
      if (!title) return;

      const list = appData.lists.find(l => l.id === listId);
      const newItem = {
        id: Date.now(),
        title: title,
        vorhanden: false,
        verantwortlich: '',
        woBesorgen: '',
        notizen: '',
        schemaValues: {},
        localFields: [],
        isEditing: false
      };

      list.items.push(newItem);
      input.value = '';
      render();
      saveDataToGitHub();
    }

    function toggleVorhanden(listId, itemId) {
      const list = appData.lists.find(l => l.id === listId);
      const item = list.items.find(i => i.id === itemId);
      item.vorhanden = !item.vorhanden;
      render();
      saveDataToGitHub();
    }

    function toggleEdit(listId, itemId) {
      const list = appData.lists.find(l => l.id === listId);
      const item = list.items.find(i => i.id === itemId);
      item.isEditing = !item.isEditing;
      render();
    }

    function saveItem(listId, itemId) {
      const list = appData.lists.find(l => l.id === listId);
      const item = list.items.find(i => i.id === itemId);

      item.title = document.getElementById(`edit-title-${itemId}`).value.trim() || 'Unbenannt';
      item.verantwortlich = document.getElementById(`edit-resp-${itemId}`).value.trim();
      item.woBesorgen = document.getElementById(`edit-where-${itemId}`).value.trim();
      item.notizen = document.getElementById(`edit-notes-${itemId}`).value.trim();

      if (list.schema) {
        list.schema.forEach(field => {
          const el = document.getElementById(`edit-schema-${itemId}-${field.id}`);
          if (el) {
            item.schemaValues[field.id] = field.type === 'boolean' ? el.checked : el.value;
          }
        });
      }

      if (item.localFields) {
        item.localFields.forEach(field => {
          const el = document.getElementById(`edit-local-${itemId}-${field.id}`);
          if (el) {
            field.value = field.type === 'boolean' ? el.checked : el.value;
          }
        });
      }

      item.isEditing = false;
      render();
      saveDataToGitHub();
    }

    function deleteItem(listId, itemId) {
      const list = appData.lists.find(l => l.id === listId);
      list.items = list.items.filter(i => i.id !== itemId);
      render();
      saveDataToGitHub();
    }

    function promptAddCustomField(listId, itemId) {
      const fieldName = prompt('Name des neuen Feldes (z. B. "Menge"):');
      if (!fieldName) return;

      const fieldType = confirm('Ja/Nein-Schalter? (Abbrechen für Textfeld)') ? 'boolean' : 'text';
      const applyToAll = confirm(`Feld "${fieldName}" für ALLE Einträge in dieser Liste übernehmen?`);

      const fieldId = 'f_' + Date.now();

      if (applyToAll) {
        const list = appData.lists.find(l => l.id === listId);
        if (!list.schema) list.schema = [];
        list.schema.push({ id: fieldId, label: fieldName, type: fieldType });
      } else {
        const list = appData.lists.find(l => l.id === listId);
        const item = list.items.find(i => i.id === itemId);
        if (!item.localFields) item.localFields = [];
        item.localFields.push({ id: fieldId, label: fieldName, type: fieldType, value: fieldType === 'boolean' ? false : '' });
      }

      render();
    }

    function render() {
      const container = document.getElementById('checklists-container');
      container.innerHTML = '';

      const filterStatus = document.getElementById('filter-status').value;
      const filterPerson = document.getElementById('filter-person').value;

      if (appData.lists.length === 0) {
        container.innerHTML = '<p style="color: var(--text-muted); text-align: center; padding: 10px 0;">Keine Checklisten vorhanden.</p>';
        return;
      }

      appData.lists.forEach(list => {
        const filteredItems = list.items.filter(item => {
          if (filterStatus === 'missing' && item.vorhanden) return false;
          if (filterStatus === 'available' && !item.vorhanden) return false;

          if (filterPerson !== 'all' && (item.verantwortlich || '').trim().toLowerCase() !== filterPerson.toLowerCase()) {
            return false;
          }

          return true;
        });

        if ((filterStatus !== 'all' || filterPerson !== 'all') && filteredItems.length === 0) {
          return;
        }

        const listEl = document.createElement('div');
        listEl.className = 'card';

        let itemsHtml = '';

        if (filteredItems.length === 0) {
          itemsHtml = '<p style="font-size:0.75rem; color:var(--text-muted); text-align:center; margin: 4px 0;">Keine Einträge vorhanden.</p>';
        } else {
          let rowsHtml = '';
          filteredItems.forEach(item => {
            const isAvailClass = item.vorhanden ? 'is-available' : 'is-missing';

            let badges = '';
            if (item.verantwortlich) badges += `<span class="badge">👤 ${escapeHtml(item.verantwortlich)}</span>`;
            if (item.woBesorgen) badges += `<span class="badge">📍 ${escapeHtml(item.woBesorgen)}</span>`;

            if (list.schema) {
              list.schema.forEach(f => {
                const val = item.schemaValues ? item.schemaValues[f.id] : null;
                if (f.type === 'boolean' && val) badges += `<span class="badge">🔹 ${escapeHtml(f.label)}</span>`;
                else if (f.type === 'text' && val) badges += `<span class="badge">🔹 ${escapeHtml(f.label)}: ${escapeHtml(val)}</span>`;
              });
            }

            if (item.localFields) {
              item.localFields.forEach(f => {
                if (f.type === 'boolean' && f.value) badges += `<span class="badge">🔸 ${escapeHtml(f.label)}</span>`;
                else if (f.type === 'text' && f.value) badges += `<span class="badge">🔸 ${escapeHtml(f.label)}: ${escapeHtml(f.value)}</span>`;
              });
            }

            if (item.isEditing) {
              let schemaFieldsInputs = '';
              if (list.schema) {
                list.schema.forEach(f => {
                  const val = item.schemaValues ? item.schemaValues[f.id] : '';
                  if (f.type === 'boolean') {
                    schemaFieldsInputs += `
                      <label class="checkbox-label" style="margin-top:4px;">
                        <input type="checkbox" id="edit-schema-${item.id}-${f.id}" ${val ? 'checked' : ''}> ${escapeHtml(f.label)}
                      </label>`;
                  } else {
                    schemaFieldsInputs += `
                      <div>
                        <label>${escapeHtml(f.label)}</label>
                        <input type="text" id="edit-schema-${item.id}-${f.id}" value="${escapeHtml(val || '')}">
                      </div>`;
                  }
                });
              }

              let localFieldsInputs = '';
              if (item.localFields) {
                item.localFields.forEach(f => {
                  if (f.type === 'boolean') {
                    localFieldsInputs += `
                      <label class="checkbox-label" style="margin-top:4px;">
                        <input type="checkbox" id="edit-local-${item.id}-${f.id}" ${f.value ? 'checked' : ''}> ${escapeHtml(f.label)}
                      </label>`;
                  } else {
                    localFieldsInputs += `
                      <div>
                        <label>${escapeHtml(f.label)}</label>
                        <input type="text" id="edit-local-${item.id}-${f.id}" value="${escapeHtml(f.value || '')}">
                      </div>`;
                  }
                });
              }

              rowsHtml += `
                <div class="edit-form">
                  <strong>Eintrag bearbeiten</strong>
                  <label>Titel / Name</label>
                  <input type="text" id="edit-title-${item.id}" value="${escapeHtml(item.title)}">

                  <div class="grid-2">
                    <div>
                      <label>Verantwortlich</label>
                      <input type="text" id="edit-resp-${item.id}" value="${escapeHtml(item.verantwortlich || '')}">
                    </div>
                    <div>
                      <label>Wo zu besorgen</label>
                      <input type="text" id="edit-where-${item.id}" value="${escapeHtml(item.woBesorgen || '')}">
                    </div>
                  </div>

                  ${schemaFieldsInputs}
                  ${localFieldsInputs}

                  <label>Notizen</label>
                  <textarea id="edit-notes-${item.id}">${escapeHtml(item.notizen || '')}</textarea>

                  <div style="margin-top: 6px; display: flex; gap: 4px; justify-content: space-between; align-items: center;">
                    <button class="btn btn-secondary btn-sm" onclick="promptAddCustomField(${list.id}, ${item.id})">+ Feld</button>
                    <div class="flex-row">
                      <button class="btn btn-danger btn-sm" onclick="deleteItem(${list.id}, ${item.id})">Löschen</button>
                      <button class="btn btn-sm" onclick="saveItem(${list.id}, ${item.id})">Speichern</button>
                    </div>
                  </div>
                </div>
              `;
            } else {
              // SCHLANKE EINZEILEN-ANSICHT
              rowsHtml += `
                <div class="item-row ${isAvailClass}">
                  <div class="item-content">
                    <label class="checkbox-label">
                      <input type="checkbox" ${item.vorhanden ? 'checked' : ''} onchange="toggleVorhanden(${list.id}, ${item.id})">
                      <span class="item-title-text ${item.vorhanden ? 'completed' : ''}">${escapeHtml(item.title)}</span>
                    </label>

                    ${badges ? `<div class="meta-badges">${badges}</div>` : ''}
                    ${item.notizen ? `<span class="item-notes-inline" title="${escapeHtml(item.notizen)}">📝 ${escapeHtml(item.notizen)}</span>` : ''}
                  </div>

                  <button class="btn btn-secondary btn-sm" onclick="toggleEdit(${list.id}, ${item.id})" style="padding: 1px 4px; font-size: 0.65rem;">✏️</button>
                </div>
              `;
            }
          });

          itemsHtml = `<div class="items-list">${rowsHtml}</div>`;
        }

        listEl.innerHTML = `
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; gap: 4px;">
            <h2 style="margin: 0; font-size: 0.95rem;">${escapeHtml(list.title)}</h2>
            <button class="btn btn-danger btn-sm" onclick="deleteList(${list.id})">Löschen</button>
          </div>
          <div>${itemsHtml}</div>
          
          <div class="flex-row" style="margin-top: 6px;">
            <input type="text" id="input-add-item-${list.id}" placeholder="Eintrag hinzufügen..." onkeydown="if(event.key==='Enter') addItemDirect(${list.id})">
            <button class="btn btn-sm" onclick="addItemDirect(${list.id})">+</button>
          </div>
        `;

        container.appendChild(listEl);
      });
    }

    function escapeHtml(text) {
      if (!text) return '';
      return String(text).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }
  </script>
</body>
</html>
